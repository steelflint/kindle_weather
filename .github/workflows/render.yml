name: Render dashboard

# Renders the weather dashboard and publishes it as dash.png on the
# `dashboard` branch, which the Kindle downloads from
# https://raw.githubusercontent.com/<owner>/<repo>/dashboard/dash.png

on:
  schedule:
    # Every 15 minutes (UTC), a few minutes before the Kindle's :00 / :30
    # refreshes. GitHub often starts scheduled runs late, especially around
    # :00, so these deliberately avoid the top of the hour.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab
  push:
    branches: [main]

permissions:
  contents: write # needed to push the dashboard branch

concurrency:
  group: render-dashboard
  cancel-in-progress: false

env:
  DASH_LAT: "52.7077"
  DASH_LON: "-2.7540"
  DASH_PLACE: "Shrewsbury"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          if [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq fonts-dejavu-core
          fi

      - name: Render (retries if Open-Meteo has a blip)
        run: |
          mkdir -p out
          for attempt in 1 2 3; do
            python weather_dash.py render -o out/dash.png && exit 0
            echo "Attempt $attempt failed, retrying in 30s"
            sleep 30
          done
          exit 1

      - name: Publish to the dashboard branch
        # Force-pushes a single-commit branch, so the repo doesn't grow
        # by a new image every 15 minutes.
        working-directory: out
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q -b dashboard
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dash.png
          git commit -q -m "Dashboard $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dashboard
          echo "Published https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/dashboard/dash.png"
